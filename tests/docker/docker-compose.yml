version: '3.7'
services:
  code:
    build:
      context: .
    container_name: dbal-code
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: dbal-mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - type: bind
        source: ../../
        target: /app
  mysql:
    image: mysql:5.7
    container_name: dbal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress