services:
    php83:
        profiles: [ "php83" ]
        build:
            context: ./php83
        container_name: dbal-php-83
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            - type: bind
              source: ../../
              target: /app
    php82:
        profiles: ["php82"]
        build:
            context: ./php82
        container_name: dbal-php-82
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            -   type: bind
                source: ../../
                target: /app
    mysql:
        image: mysql:5.7
        container_name: dbal-mysql
        environment:
            MYSQL_ROOT_PASSWORD: wordpress
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
            timeout: 5s
            retries: 10
