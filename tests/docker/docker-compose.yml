services:
    php82:
        profiles: ["php82"]
        build:
            context: ./php82
        container_name: dbal-php-82
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            -   type: bind
                source: ../../
                target: /app
    php81:
        profiles: ["php81"]
        build:
            context: ./php81
        container_name: dbal-php-81
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            -   type: bind
                source: ../../
                target: /app
    php80:
        profiles: [ "php80" ]
        build:
            context: ./php80
        container_name: dbal-php-80
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            - type: bind
              source: ../../
              target: /app
    php74:
        profiles: ["php74"]
        build:
            context: ./php74
        container_name: dbal-php-74
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            -   type: bind
                source: ../../
                target: /app
    php73:
        profiles: ["php73"]
        build:
            context: ./php73
        container_name: dbal-php-73
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            -   type: bind
                source: ../../
                target: /app
    php72:
        profiles: ["php72"]
        build:
            context: ./php72
        container_name: dbal-php-72
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            WORDPRESS_DB_HOST: dbal-mysql
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
        volumes:
            -   type: bind
                source: ../../
                target: /app
    mysql:
        image: mysql:5.7
        container_name: dbal-mysql
        environment:
            MYSQL_ROOT_PASSWORD: wordpress
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
            timeout: 5s
            retries: 10
