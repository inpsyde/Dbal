name: Integration Tests

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '**/integration-tests*'
            - '**/docker/**'
            - '**.php'
            - 'phpunit*'
            - 'composer.*'
    push:
        paths:
            - '**/integration-tests*'
            - '**/docker/**'
            - '**.php'
            - 'phpunit*'
            - 'composer.*'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    execute-tests:
        runs-on: ubuntu-latest
        if: ${{ !contains(github.event.head_commit.message, 'integration-tests skip') }}
        strategy:
            matrix:
                php-version: [ '8.2', '8.3' ]
                wp-version: [ '6.5', '6.6', '6.7', '6' ]
                exclude:
                    - php-version: '8.3'
                      wp-version: '6.5'
                    - php-version: '8.3'
                      wp-version: '6.6'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: none

            -   name: Adjust Composer Dependencies
                run: |
                    composer config --unset repositories.0
                    composer remove syde/phpcs inpsyde/wp-stubs-versions roots/wordpress-no-content --dev --no-update
                    composer require "roots/wordpress-no-content:${{ matrix.wp-version }}.*" --no-update

            -   name: Install Composer Dependencies
                uses: ramsey/composer-install@v3

            -   name: Run integration tests
                working-directory: ./tests
                run: |
                    chmod u+x ./integration-tests.sh
                    ./integration-tests.sh ${{ matrix.php-version }}
