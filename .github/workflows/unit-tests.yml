name: Unit Tests

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '**/unit-tests*'
            - '**.php'
            - 'phpunit*'
            - 'composer.*'
    push:
        paths:
            - '**/unit-tests*'
            - '**.php'
            - 'phpunit*'
            - 'composer.*'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    execute-tests:
        runs-on: ubuntu-latest
        if: ${{ !contains(github.event.head_commit.message, 'integration-tests skip') }}
        strategy:
            matrix:
                php-version: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
                wp-version: [ '6.1', '6.2', '6.3', '6.4', '6' ]
                exclude:
                    - php-version: '8.3'
                      wp-version: '6.1'
                    - php-version: '8.3'
                      wp-version: '6.2'
                    - php-version: '8.3'
                      wp-version: '6.3'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: none

            -   name: Adjust Composer Dependencies
                run: |
                    composer config --unset repositories.0
                    composer remove inpsyde/php-coding-standards inpsyde/wp-stubs-versions roots/wordpress-no-content vimeo/psalm --dev --no-update
                    composer require "roots/wordpress-no-content:${{ matrix.wp-version }}.*" --no-update

            -   name: Install Composer Dependencies
                uses: ramsey/composer-install@v3

            -   name: Run unit tests
                run:  ./vendor/bin/phpunit --testsuite=unit --no-coverage
